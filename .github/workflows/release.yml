# Publica uma release sempre que um push em main traz uma versão nova.
#
# Para lançar: altere "Version:" e EBR_ADS_VERSION em ebr-ads.php (iguais),
# "Stable tag" e o Changelog em readme.txt, e faça push. Se a tag vX.Y.Z já
# existir, nada acontece — push sem mudança de versão não gera release.
#
# O asset ebr-ads.zip é o que os sites baixam (ver includes/class-ebr-ads-updater.php).
# Ele tem a pasta ebr-ads/ na raiz, para o WordPress instalar no lugar certo.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler e validar a versão
        id: version
        run: |
          header=$(grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:' ebr-ads.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          const=$(grep -m1 -oE "define\( *'EBR_ADS_VERSION', *'[^']+'" ebr-ads.php | grep -oE "'[^']+'$" | tr -d "'")
          stable=$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/Stable tag:[[:space:]]*//' | tr -d '[:space:]')

          echo "Version: $header | EBR_ADS_VERSION: $const | Stable tag: $stable"

          if ! echo "$header" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error file=ebr-ads.php::Version inválida: '$header'"
            exit 1
          fi
          if [ "$header" != "$const" ]; then
            echo "::error file=ebr-ads.php::Version ($header) diferente de EBR_ADS_VERSION ($const)"
            exit 1
          fi
          if [ "$header" != "$stable" ]; then
            echo "::warning file=readme.txt::Stable tag ($stable) diferente da versão ($header)"
          fi

          echo "version=$header" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$header" > /dev/null; then
            echo "Tag v$header já existe — nada a publicar."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar sintaxe PHP
        if: steps.version.outputs.exists == 'false'
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Montar ebr-ads.zip
        if: steps.version.outputs.exists == 'false'
        # git archive respeita o export-ignore do .gitattributes (.github, README.md...).
        run: git archive --format=zip --prefix=ebr-ads/ -o ebr-ads.zip HEAD

      - name: Notas da versão (do Changelog do readme.txt)
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '{sub(/\r$/, "")} $0 == "= " v " =" {f=1; next} f && /^= / {exit} f' readme.txt > notes.md
          if [ ! -s notes.md ]; then echo "Versão $VERSION." > notes.md; fi
          cat notes.md

      - name: Publicar release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" ebr-ads.zip \
            --title "EBR Ads $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
